<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activity · ClearBill</title><link rel="stylesheet" href="/css/styles.css"><script defer src="/vendor/ethers.min.js"></script><script type="module" src="/js/activity.js"></script></head><body>
<header class="app-header"><div class="header-inner"><a class="brand" href="/">ClearBill</a><div class="header-actions"><span class="network network-name">Network</span><button id="wallet-button" type="button">Connect wallet</button></div></div></header>
<main><h1>Activity</h1><p id="wallet-note" class="muted"></p><p id="page-status" class="status" role="status" aria-live="polite"></p><section><h2>Submitted from this browser</h2><div id="local-transactions" class="stack"></div></section><section><h2>Confirmed chain history</h2><div class="panel filter-grid"><div class="form-field"><label for="type">Type</label><select id="type"><option value="all">All</option><option value="created">Created</option><option value="payment">Payment</option><option value="cancelled">Cancelled</option><option value="refund">Refund</option></select></div><div class="form-field"><label for="bill-id">Bill ID</label><input id="bill-id" inputmode="numeric" placeholder="Any"></div><div class="form-field"><label for="from-date">From date</label><input id="from-date" type="date"></div><div class="form-field"><label for="to-date">To date</label><input id="to-date" type="date"></div><button id="apply-filters">Apply filters</button></div><p id="scan-progress" class="muted"></p><div id="activity-list" class="stack"></div><div class="actions"><button id="load-older" hidden>Load older</button><button id="export-csv" hidden>Export complete CSV</button></div></section></main>
<nav class="bottom-nav" aria-label="Main navigation"><a href="/">Overview</a><a href="/bills">Bills</a><a href="/activity" aria-current="page">Activity</a></nav></body></html>
